[lint.flake8-bugbear]
# FastAPI evalúa estas dependencias en cada petición; no son valores por defecto mutables (B008)
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]
